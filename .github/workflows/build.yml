name: Build & Release Batman

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package Universal Android Artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build All Release Artifacts
        run: |
          python BatmanApp/build_apk.py

      - name: Run Verification Test Suite
        run: |
          python test_universal_suite.py

      - name: Upload Artifacts to Workflow Run
        uses: actions/upload-artifact@v4
        with:
          name: batman-v1.0.0-release-artifacts
          path: |
            Batman-v1.0.0-universal.apk
            Batman-v1.0.0-arm32.apk
            Batman-v1.0.0-arm64.apk
            Batman.apk
            Batman-v1.0.0.aab

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Batman Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            Batman-v1.0.0-universal.apk
            Batman-v1.0.0-arm32.apk
            Batman-v1.0.0-arm64.apk
            Batman.apk
            Batman-v1.0.0.aab
