name: Build & Release Batman

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package Universal Android Artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          # Accept all preinstalled and required licenses non-interactively
          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          set -o pipefail

          # Install target platform and build-tools
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

          # Re-accept licenses for newly installed components
          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          set -o pipefail

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build All Release Artifacts
        run: |
          python BatmanApp/build_apk.py

      - name: Run Verification Test Suite
        run: |
          python test_universal_suite.py

      - name: Upload Artifacts to Workflow Run
        uses: actions/upload-artifact@v4
        with:
          name: batman-v1.0.0-release-artifacts
          path: |
            BatmanApp/Batman-v1.0.0-universal.apk
            BatmanApp/Batman-v1.0.0-arm32.apk
            BatmanApp/Batman-v1.0.0-arm64.apk
            BatmanApp/Batman.apk
            BatmanApp/Batman-v1.0.0.aab

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Batman Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            BatmanApp/Batman-v1.0.0-universal.apk
            BatmanApp/Batman-v1.0.0-arm32.apk
            BatmanApp/Batman-v1.0.0-arm64.apk
            BatmanApp/Batman.apk
            BatmanApp/Batman-v1.0.0.aab
